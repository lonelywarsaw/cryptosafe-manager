[pytest]
testpaths = tests
pythonpath = src
addopts =
    -q
    --strict-markers
    --ignore=tests/test_integration.py
    --ignore=tests/test_password_change_integration.py
    -m "not perf and not slow"
markers =
    perf: performance / load benchmarks (not in default sprint-8 run)
    slow: long-running tests (Win32 dump, multi-second waits, bulk CRUD 100+)
